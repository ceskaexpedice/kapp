stages:
  - build
  - publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: eclipse-temurin:21-jdk-jammy
  cache:
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

backend_build:
  stage: build
  script:
    - java -version
    - chmod +x mvnw
    - ./mvnw --batch-mode --no-transfer-progress clean verify
  artifacts:
    when: always
    reports:
      junit:
        - services/*/target/surefire-reports/TEST-*.xml
        - single-use-services/*/target/surefire-reports/TEST-*.xml
  rules:
    - changes: &backend_changes
        - .gitlab-ci.yml
        - .mvn/**/*
        - mvnw
        - mvnw.cmd
        - pom.xml
        - services/**/*
        - single-use-services/**/*

backend_image_publish:
  stage: publish
  script:
    - chmod +x mvnw
    - ./mvnw --batch-mode --no-transfer-progress -pl services/scheduler -am install -DskipTests
    - ./mvnw --batch-mode --no-transfer-progress -f services/scheduler/pom.xml jib:build -DskipTests "-Djib.to.auth.username=$CI_REGISTRY_USER" "-Djib.to.auth.password=$CI_JOB_TOKEN"
  rules:
    - changes: *backend_changes
      when: manual
  allow_failure: false

web_application_pipeline:
  stage: publish
  trigger:
    include:
      - local: web-services/kuratorska-aplikace-web/.gitlab-ci.yml
    strategy: mirror
  rules:
    - changes:
        - .gitlab-ci.yml
        - web-services/kuratorska-aplikace-web/**/*

deploy-pages:
  stage: publish
  image: python:3.13-slim
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install --disable-pip-version-check --requirement requirements.txt
  script:
    - python -m mkdocs build --strict --site-dir public
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
