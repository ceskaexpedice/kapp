openapi: 3.0.3
info:
  title: Kuratorska aplikace REST API
  version: 1.0.0
  description: REST API pro predavani zmenenych licenci dokumentu.
servers:
  - url: http://localhost:8080/api
    description: Lokalni vyvojove prostredi
tags:
  - name: Changes
    description: Zmenene licence dokumentu
paths:
  /changes:
    get:
      tags:
        - Changes
      summary: Vrati zmenene licence dokumentu
      description: >
        Vraci dokumenty, u kterych byla zmenena prirazena licence. Vystup lze
        filtrovat podle licence, zdrojove digitalni knihovny a casu zmeny.
      operationId: listChangedLicenses
      parameters:
        - name: license
          in: query
          required: false
          description: Filtr podle prirazene licence.
          schema:
            $ref: "#/components/schemas/License"
          example: public
        - name: source
          in: query
          required: false
          description: >
            Filtr podle zdrojove digitalni knihovny. Odpovida zkratce zdroje,
            napr. hodnote pole digital_library.
          schema:
            type: string
            minLength: 1
          example: mzk
        - name: from
          in: query
          required: false
          description: >
            Vrati pouze zmeny s datem zmeny vetsim nebo rovnym zadane hodnote.
            Datum se predava v UTC jako ISO 8601 date-time.
          schema:
            type: string
            format: date-time
          example: "2026-06-01T00:00:00Z"
      responses:
        "200":
          description: Seznam zmenenych licenci odpovidajicich filtru.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangedLicense"
              example:
                - pid: "uuid:xxxx"
                  license: public
                  source: mzk
                  date: "2026-06-01T12:34:56Z"
        "400":
          description: Neplatny filtr nebo spatny format parametru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "Parameter 'from' must be a valid UTC ISO 8601 date-time."
        "500":
          description: Interni chyba serveru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    License:
      type: string
      description: Prirazena licence dokumentu.
      enum:
        - public
        - onsite
    ChangedLicense:
      type: object
      description: Zaznam o zmene licence dokumentu.
      additionalProperties: false
      required:
        - pid
        - license
        - source
        - date
      properties:
        pid:
          type: string
          description: PID dokumentu.
          pattern: "^uuid:.+"
          example: "uuid:xxxx"
        license:
          $ref: "#/components/schemas/License"
        source:
          type: string
          description: Zkratka zdrojove digitalni knihovny.
          example: mzk
        date:
          type: string
          format: date-time
          description: Datum a cas zmeny licence v UTC.
          example: "2026-06-01T12:34:56Z"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Strojove citelny kod chyby.
          example: invalid_request
        message:
          type: string
          description: Popis chyby.
          example: Invalid request.
