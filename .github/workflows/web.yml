name: Web CI

on:
  push:
    paths:
      - .github/workflows/web.yml
      - web-services/kuratorska-aplikace-web/**
  pull_request:
    paths:
      - .github/workflows/web.yml
      - web-services/kuratorska-aplikace-web/**
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB_APP_DIR: web-services/kuratorska-aplikace-web/kuappweb

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: web-services/kuratorska-aplikace-web/kuappweb/pom.xml

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-services/kuratorska-aplikace-web/kuappweb/src/main/ng/package-lock.json

      - name: Build web application
        run: ./mvnw --batch-mode --no-transfer-progress -f "$WEB_APP_DIR/pom.xml" clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-reports
          path: web-services/kuratorska-aplikace-web/kuappweb/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish web image
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: web-services/kuratorska-aplikace-web/kuappweb/pom.xml

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-services/kuratorska-aplikace-web/kuappweb/src/main/ng/package-lock.json

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/kapp-web-build" >> "$GITHUB_OUTPUT"

      - name: Build web image contents
        run: ./mvnw --batch-mode --no-transfer-progress -f "$WEB_APP_DIR/pom.xml" clean install -DskipTests

      - name: Publish web image to GHCR
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -f "$WEB_APP_DIR/pom.xml"
          jib:build
          -DskipTests
          -Djib.to.image="${{ steps.image.outputs.name }}"
          -Djib.to.auth.username="${{ github.actor }}"
          -Djib.to.auth.password="${{ secrets.GITHUB_TOKEN }}"
