name: Backend CI

on:
  push:
    paths:
      - .github/workflows/backend.yml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - pom.xml
      - services/**
      - single-use-services/**
  pull_request:
    paths:
      - .github/workflows/backend.yml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - pom.xml
      - services/**
      - single-use-services/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/*/target/surefire-reports/
            single-use-services/*/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish backend image
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/kapp-backend-build" >> "$GITHUB_OUTPUT"

      - name: Build backend dependencies
        run: ./mvnw --batch-mode --no-transfer-progress -pl services/scheduler -am install -DskipTests

      - name: Publish backend image to GHCR
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -f services/scheduler/pom.xml
          jib:build
          -DskipTests
          -Djib.to.image="${{ steps.image.outputs.name }}"
          -Djib.to.auth.username="${{ github.actor }}"
          -Djib.to.auth.password="${{ secrets.GITHUB_TOKEN }}"
