<mat-toolbar  class="app-fxLayout-row">
  <div class="app-fxFlex">
    <a [routerLink]="['/']" queryParamsHandling="preserve" class="app-fxFlex app-fxLayout app-row app-center-v app-logo">
      <span>Kurátorská aplikace</span>
    </a>
  </div>
  <div class="app-fxLayout app-row app-center-v">
    <a [routerLink]="['titles']" routerLinkActive="app-active-link" matButton>{{ 'navbar.titles' | translate}}</a>
    <a [routerLink]="['authors']" routerLinkActive="app-active-link" matButton>{{ 'navbar.authors' | translate}}</a>
    <a [routerLink]="['batches']" routerLinkActive="app-active-link" matButton>{{ 'navbar.batches' | translate}}</a>
    <a matButton (click)="goToKeycloakLogin()">{{ 'navbar.login' | translate}}</a>
    <a [routerLink]="['admin']" routerLinkActive="app-active-link" matButton>{{ 'navbar.admin' | translate}}</a>
    <a matButton [matMenuTriggerFor]="menu">{{ translator.currentLang | translate}}</a>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="onLanguageChanged('cs')">Český</button>
      <button mat-menu-item (click)="onLanguageChanged('en')">English</button>
    </mat-menu>
  </div>
</mat-toolbar>
