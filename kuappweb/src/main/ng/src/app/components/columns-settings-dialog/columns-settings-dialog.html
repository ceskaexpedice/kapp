<h1 mat-dialog-title>{{ 'titleColumns_dialog' | translate }}</h1>
<div mat-dialog-content class="app-scrollbar-fix">
  <fieldset class="app-p-4 app-mb-3" cdkDropList (cdkDropListDropped)="drop($event)">
    
        <legend>{{ 'titleColumns_dialog' | translate }}</legend>
        @for(column of allColumns; track $index;) {
        <div cdkDropListOrientation="vertical" cdkDrag>
          <mat-checkbox name="column.field" [(ngModel)]="column.selected">{{ 'field.' + column.field | translate }}</mat-checkbox>
        </div>
      }
  
  
  </fieldset>
  
</div>
<div mat-dialog-actions cdkFocusRegionstart>
  <button matButton="filled" (click)="save()" >{{ 'action.save' | translate }}</button>
  <button matButton="outlined" [mat-dialog-close]="false" >{{ 'action.close' | translate }}</button>
</div>
