<div class="app-home-layout app-fxLayout app-row app-fill">
    <mat-card appearance="outlined">
        <mat-card-header>
            <mat-card-title> {{ 'search' | translate}} </mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <mat-form-field appearance="outline">
                <mat-label>{{ 'action.search' | translate }}</mat-label>
                <input [(ngModel)]="q" matInput placeholder="{{ 'field.query' | translate }}">
                <mat-icon matSuffix (click)="doSearch()">search</mat-icon>
            </mat-form-field>
        </mat-card-content>
        <mat-card-actions align="end" class="app-mat-card-actions">
            <a [routerLink]="['/results']" queryParamsHandling="preserve" mat-raised-button>{{ 'go' | translate }}</a>
        </mat-card-actions>
    </mat-card>
</div>
