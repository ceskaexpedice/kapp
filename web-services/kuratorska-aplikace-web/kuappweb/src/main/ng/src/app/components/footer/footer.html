
@if (isHome) {
  <div class="app-fxLayout app-column app-center-v app-info app-gap-6">
	  <strong>{{ "footer.info" | translate }}</strong>
    <div class="app-fxLayout app-row app-center-v app-gap-8">
      <img src="assets/img/logo-npo.svg" [alt]="'footer.npo' | translate" />
      <img src="assets/img/logo-ngeu.svg" [alt]="'footer.ngeu' | translate" />
    </div>
  </div>
}
<div class="app-fxLayout app-row app-center-v app-pl-4 app-pr-4 app-footer">
  <div class="app-left app-fxFlex">
    {{ "footer.kap" | translate }} © {{ currentYear }}
  </div>
  <div class="app-right">
    {{ "footer.development" | translate }} <a href="http://www.gnu.org/licenses/gpl.html" target="_blank">GNU GPL v3.</a>
  </div>
</div>
