<h2 mat-dialog-title>{{ 'add_to_batch' | translate }}</h2>
<mat-dialog-content class="app-pt-2">
  <mat-form-field appearance="outline" class="app-w-100">
    <mat-label>{{ 'PID' | translate }}</mat-label>
    <input  cdkFocusInitial [(ngModel)]="pid" matInput />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
	<button matButton="filled" [disabled]="!pid" [mat-dialog-close]="pid">{{ 'action.add' | translate }}</button>
	<button matButton="outlined" mat-dialog-close>{{ 'action.close' | translate }}</button>
</mat-dialog-actions>
