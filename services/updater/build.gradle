plugins {
    id 'java'
    id 'application'
}

group = 'cz.inovatika'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    api project(':single-use-services:excel-importer')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'cz.inovatika.UpdaterJob'
}

tasks.named('run') {
    dependsOn ':services:scheduler:classes'
    classpath = project(':services:scheduler').sourceSets.main.runtimeClasspath
}

test {
    useJUnitPlatform()
}
