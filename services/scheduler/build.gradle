plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.1.0'
    id 'com.google.cloud.tools.jib' version '3.4.1'
}

group = 'cz.inovatika'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'cz.inovatika.SchedulerMain'
}
jar {
    manifest {
        attributes(
                'Main-Class': 'cz.inovatika.SchedulerMain'
        )
    }
}
jib {
    from {
        image = 'eclipse-temurin:21-jre'
    }

    to {
        //image = 'jiriminov/kappscheduler:latest'
        image = "registry.gitlab.com/inovatika/nkp/nkp-kuratorska-aplikace/kappscheduler"
        tags = ['latest',project.version]
    }

    container {
        mainClass = 'cz.inovatika.SchedulerMain'
        //ports = ['8080'] // remove if not needed
        jvmFlags = ['-Xms256m', '-Xmx512m']
    }
}
dependencies {

    api project(':services:init')
    api project(':services:harvester')
    api project(':services:Updater')

    implementation("org.quartz-scheduler:quartz:2.5.2")

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
}

