services:
  scheduler:
    image: jiriminov/kappScheduler
    container_name: kappScheduler
    volumes:
      - ./mnt/import/.kapp:/root/.kapp
    restart: unless-stopped

  solr:
    image: solr:9
    container_name: solr-kappScheduler
    ports:
      - "8983:8983"
    volumes:
      - ./../../kuratorska-aplikace-web/solr:/var/solr
  tomcat:
    image: jiriminov/kuappweb:latest
    container_name: kuappweb
    ports:
      - "8080:8080" 
    volumes:
      - ./../../kuratorska-aplikace-web/kuappweb/target:/usr/local/tomcat/webapps 
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    restart: unless-stopped