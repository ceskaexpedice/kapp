services:

  scheduler:
    image: registry.gitlab.com/inovatika/nkp/nkp-kuratorska-aplikace/kappscheduler:latest
    depends_on:
      solr:
        condition: service_healthy
    container_name: kappScheduler
    volumes:
      - ./.kapp:/root/.kapp
    restart: unless-stopped

  solr:
    image: solr:9
    container_name: solr-kappScheduler
    ports:
      - "8983:8983"
    volumes:
      - /home/kapp/solr:/var/solr
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8983/solr/admin/cores?action=STATUS" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  tomcat:
    image: registry.gitlab.com/inovatika/nkp/kuratorska-aplikace-web/kuappweb:latest
    container_name: kuappweb
    ports:
      - "8088:8080" 
    volumes:
      - ./.kapp:/root/.kapp
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    restart: unless-stopped