services:
  scheduler:
    image: jiriminov/kappscheduler:latest
    depends_on:
      solr:
        condition: service_healthy
    container_name: kappScheduler
    volumes:
      - ./mnt/import/.kapp:/root/.kapp
    restart: unless-stopped

  solr:
    image: solr:9
    container_name: solr-kappScheduler
    ports:
      - "8983:8983"
    volumes:
      - ./../../kuratorska-aplikace-web/solr:/var/solr
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8983/solr/admin/cores?action=STATUS" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  tomcat:
    image: jiriminov/kuappweb:latest
    container_name: kuappweb
    ports:
      - "8080:8080" 
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    restart: unless-stopped