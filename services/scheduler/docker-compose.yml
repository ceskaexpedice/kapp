services:
  scheduler:
    image: scheduler:latest
    container_name: kappScheduler
    volumes:
      - ./mnt/import/.kapp:/root/.kapp
    restart: unless-stopped

  solr:
    image: solr:9
    container_name: solr-kappScheduler
    ports:
      - "8983:8983"
    volumes:
      - ./../../kuratorska-aplikace-web/solr:/var/solr
  tomcat:
    image: tomcat:9.0.107-jdk21-temurin  # You can choose a different version if needed
    container_name: tomcat
    ports:
      - "8080:8080"           # Expose Tomcat on localhost:8080
    volumes:
      - ./../../kuratorska-aplikace-web/kuappweb/target:/usr/local/tomcat/webapps  # Map local webapps folder to Tomcat
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
    restart: unless-stopped