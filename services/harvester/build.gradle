plugins {
    id 'java'
}

group = 'cz.inovatika'
version = '1.0-SNAPSHOT'

// Nastavení kompatibility s Java 21, což odpovídá Maven <release>21</release>
java {
    // Nastavuje target i source kompatibilitu
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Nastavení kódování, které je ekvivalentní Maven properties
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'commons-io:commons-io:2.16.1'

    implementation 'org.apache.solr:solr-solrj:9.9.0'
    implementation project(':services:init')

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
    implementation 'com.google.guava:guava:32.1.2-jre'

}

